# plugin-qualify-sync's settings: one "key value" per line. Every key is also a flag (--budget-s for
# budget_s); plugin-qualify-sync --help lists them with their defaults. A line left commented keeps the default.

# plugin-hostd's settings file: the LV2 and CLAP directories scanned are the ones plugin-hostd searches with it
# (plugin-hostd --search-path -c <file>). lv2_path, lv2_extra and clap_path are written there, not here; empty is
# plugin-hostd's own file ($XDG_CONFIG_HOME/plugin-hostd.conf, else ~/.config/plugin-hostd.conf). Its folders are also
# watched by plugin-qualify-sync.path: a change takes effect at the next boot or `systemctl daemon-reload`.
#hostd_conf

# the wall clock one plugin gets, in seconds: past it the plugin is recorded as hung and the run goes on
#budget_s 60

# the host the verdicts are for
#host_profile omx-clap-host

# the notes an instrument that declares no voice capacity holds in a --memory-only run
#memory_notes 16

# the machine class the qualification store's records are read and written under; empty is the board's own from the
# device tree (rpi5 on a Raspberry Pi 5), else x86-64 on an x86_64 machine, else the run is refused until one is named
#host_class
