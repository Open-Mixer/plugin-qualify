name: ci

# Type-check, the TypeScript and Python tests, the catalogs and the packages, by workflow_dispatch.

# Delivery pipeline §12: no heavy Action on a push or a pull request. This workflow runs by workflow_dispatch only;
# a pull request's head is dispatched before it merges (gh workflow run ci.yml --ref <branch>), and its fast checks
# are lint.yml's, the one lint.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages (and the jobs that need this one) run only on workflow_dispatch: a pull request or a push runs the tests
  # alone (owner 2026-11-09). release.yml builds on a v* tag; fast-release dispatches this workflow on a release head.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      # Packaging runs only on workflow_dispatch (the release dry run fast-release dispatches on a release head);
      # a pull request or a push runs the tests alone. release.yml builds and publishes on a v* tag.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "packages=true"; else echo "packages=false"; fi >> "$GITHUB_OUTPUT"

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # plugin-hostd 0.21 and its contract packages come from the channel for Fedora x86_64 (no amd64 Debian suite carries
    # them): the job runs in a fedora:45 container with the channel added, as publish.yml's does; the suite's private JACK
    # servers each map their segments in /dev/shm, more than a container's default 64 MB
    container:
      image: fedora:45
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      # git before the checkout, so the tree is a git checkout (src/shipped-scripts-executable.test.ts reads its modes)
      - run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v4
      # the checkout is owned by the runner's uid, the container runs as root: git refuses it as dubious ownership
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && vars.OMX_DEVEL_CHANNEL || '' }}

      # before the install, so the build's generators read omx-clap's and omx-dsp's installed data, as the RPM build does
      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/install-plugin-hostd

      - uses: ./.github/actions/install-scanners

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: package.json names the repository this workflow runs in
        run: node packaging/check-repository.mjs

      # leaves out the files of .github/container-tests.txt (vitest.config.ts): they need omx-contract 3.20.0 as a
      # system package, which the container-tests job below installs and runs them with
      - name: Test
        run: pnpm test

      - name: Generated Python declarations are current
        run: pnpm check:generated

      # the system python3, with python3-pytest from install-scanners
      - name: Python tools
        run: pnpm test:py

      - name: The packed package carries its build
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node packaging/check-tarball.mjs "$RUNNER_TEMP"/pack/openmixer-plugin-qualify-*.tgz

  # the test files of .github/container-tests.txt: they need plugin-hostd 0.21.0 and its contract package as system packages (the
  # qualification domain, describe) and omx-contract 3.20.2 and the qualification store's commands, which the channel serves for Fedora 45;
  # the build and test job above leaves them out
  container-tests:
    name: tests that need omx-contract and the store's commands installed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: fedora:45
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git nodejs26 nodejs26-bin nodejs26-npm nodejs26-npm-bin pkgconf-pkg-config
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && vars.OMX_DEVEL_CHANNEL || '' }}
      - run: dnf install -y --setopt=install_weak_deps=False omx-contract omx-contract-devel omx-contract-data plugin-hostd-contract plugin-hostd
      # the store's reader and writer, and the contract packages whose domains the writer checks a record's words against
      - run: >-
          dnf install -y --setopt=install_weak_deps=False
          plugin-qualification-db plugin-qualification-db-write
          plugin-hostd-contract plugin-db-contract omx-clap-contract omx-dsp-contract
      # the installed contract directory, qualification domain included (plugin-hostd-contract's): a writable copy the store
      # contract tests use
      - name: The store commands' contract directory
        run: |
          dir="$(pkg-config --variable=contractdir libomx-domain 2>/dev/null || true)"
          [ -n "$dir" ] || dir=/usr/share/omx-contract/contract.d
          mkdir -p /tmp/store-contract
          cp -a "$dir"/. /tmp/store-contract/
          ls /tmp/store-contract
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # the suite reads the omx-contract installed above, not the registry's copy pnpm install fetched: a devel wave's
      # is staged, never on npm (npm publishes from a tag only); the package lands under /usr, not the Makefile's /usr/local
      - run: make link-packaged PREFIX=/usr
      - name: The generated rates are omx-dsp's
        run: node tools/gen-dsp-rates.mjs --check
      - name: Run them
        env:
          OMX_CONTAINER_TESTS: '1'
          STORE_CONTRACT_DIR: /tmp/store-contract
        run: pnpm exec vitest run $(grep -v '^#' .github/container-tests.txt)

  # one pack per listed language from the spec and debian/control, and the catalogs through omx-contract's release
  # gate (translate --check, tools/catalogs-gate.sh): a listed language with no catalog, a missing key or a stale entry
  # is red. This job only checks (fill: false): it runs where every job here runs (vars.OMX_RUNNER) and takes no cluster
  # DNS. The gaps are filled by the fill job below.
  catalogs:
    name: language packs and catalogs
    runs-on: ${{ vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: fedora:45
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git python3 nodejs26 nodejs26-bin gnupg2
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && vars.OMX_DEVEL_CHANNEL || '' }}
      - run: dnf install -y --setopt=install_weak_deps=False omx-contract omx-contract-data
      # an ordinary run builds against the channel: name where each omx package came from, refuse one from staging (D25,
      # plugin-hostd-protocol#27: a stale staged contract package outranked the channel)
      - name: Every omx package comes from the channel
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          dnf repoquery --installed --qf '%{name} %{version} %{from_repo}\n' 'omx-*' 'plugin-*' | tee /tmp/from-repo
          # a pull request into devel builds against the staging channel (devel -> staging -> prod,
          # Open-Mixer/.github add-openmixer): there a package from staging is expected; elsewhere refused
          case $EVENT:$BASE in
            pull_request*:devel) echo "a pull request into devel: a package from the staging channel is expected here" ;;
            *) if grep staging /tmp/from-repo; then echo "a package above came from the staging channel: an ordinary run builds against the channel"; exit 1; fi ;;
          esac
      - uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: plugin-qualify
          owner: plugin-qualify
          spec: packaging/plugin-qualify.spec
          gate: tools/catalogs-gate.sh
          fill: 'false'

  # the catalogs' gaps fill themselves on the organisation's own pool, where the router answers (Open-Mixer/.github#177,
  # owner ruling 2026-11-20): dispatched on a lane branch that heads one open pull request of this repository, the shared
  # workflow makes the missing entries through the router, signs them and pushes them to that branch only
  fill:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: Open-Mixer/.github/.github/workflows/langpacks-fill.yml@openmixer-v1
    with:
      name: plugin-qualify
      owner: plugin-qualify
      spec: packaging/plugin-qualify.spec
      gate: tools/catalogs-gate.sh
      # the codes are a bare item file: the gate script hands translate a vocabulary holding it, for a language too
      fill-command: tools/catalogs-gate.sh
    secrets: inherit

  # the RPM and the DEB are built, linted and assembled into unsigned trees; nothing is published
  packages:
    name: packages, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # the arm64 DEBs build at release only; no Fedora aarch64 RPM
