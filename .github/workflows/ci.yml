name: ci

# Type-check, the TypeScript and Python tests, and the generated Python declarations, on every
# pull request and every push to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The packages (and the jobs that need this one) run only on workflow_dispatch: a pull request or a push runs the tests
  # alone (owner 2026-11-09). release.yml builds on a v* tag; fast-release dispatches this workflow on a release head.
  changes:
    name: what the pull request changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      # Packaging runs only on workflow_dispatch (the release dry run fast-release dispatches on a release head);
      # a pull request or a push runs the tests alone. release.yml builds and publishes on a v* tag.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "packages=true"; else echo "packages=false"; fi >> "$GITHUB_OUTPUT"

  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install and build
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/install-plugin-hostd

      - uses: ./.github/actions/install-scanners

      - name: Type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Generated Python declarations are current
        run: pnpm check:generated

      - name: Python tools
        run: |
          python -m pip install --quiet pytest
          pnpm test:py

      - name: The packed package carries its build
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node packaging/check-tarball.mjs "$RUNNER_TEMP"/pack/openmixer-plugin-qualify-*.tgz

  # the RPM and the DEB are built, linted and assembled into unsigned trees; nothing is published
  packages:
    name: packages, dry run
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    permissions:
      contents: write
      issues: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      arm: false  # aarch64/arm64 build at release only

  # the checks every FreeMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@main
