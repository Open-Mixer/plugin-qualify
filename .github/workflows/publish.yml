name: Publish to npm

# Publishes @openmixer/plugin-qualify to npmjs.org by npm trusted publishing (OIDC, no token anywhere), with
# provenance. npmjs.com trusts the CALLER of the publish by repository + workflow filename (+ environment when
# one is set there; none is), so:
#   Repository: Open-Mixer/plugin-qualify    Workflow filename: publish.yml    Environment: (none)
# A version tag publishes; a manual dispatch is a dry run unless asked otherwise. Only the public repository
# publishes: a tag on any other copy of this tree stops before npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and run `npm publish --dry-run` only'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    if: github.repository == 'Open-Mixer/plugin-qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the suite needs plugin-hostd 0.21 and its contract packages, which the channel serves for Fedora x86_64 (no amd64
    # Debian suite carries them): the job runs in a fedora:45 container with the channel added, as root
    # the suite's private JACK servers each map their segments in /dev/shm, more than a container's default 64 MB
    container:
      image: fedora:45
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    steps:
      # git before the checkout, so the tree is a git checkout (src/shipped-scripts-executable.test.ts reads its modes)
      - run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v4
      # the checkout is owned by the runner's uid, the container runs as root: git refuses it as dubious ownership
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: The tag is the package's version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          else
            echo "not a tag: only a dry run makes sense here"
            test "${{ inputs.dry-run }}" = true
          fi

      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      # the same steps ci.yml runs: the suite on a tag needs what the suite on a branch needs. Before the install, so
      # the build's generators read omx-clap's and omx-dsp's installed data, as the RPM build does
      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/install-plugin-hostd

      - uses: ./.github/actions/install-scanners

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # leaves out the files of .github/container-tests.txt (vitest.config.ts): they need omx-contract 3.20.0 as a
      # system package, which ci.yml's container-tests job installs and runs them with
      - name: Build and test
        run: |
          pnpm lint
          pnpm test

      # trusted publishing needs npm 11.5.1 or newer, which node 24 carries
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --dry-run --provenance --access public
          else
            npm publish --provenance --access public
          fi
