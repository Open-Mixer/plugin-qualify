name: release

# A version tag builds the RPM (Fedora 45, x86_64 only; no Fedora aarch64 RPM) and the DEB (Debian trixie,
# amd64 and arm64), signs them, publishes them into the rpm/ and deb/ trees of the OpenMixer Pages
# repository and attaches them to the GitHub release, beside the `pnpm pack` tarball
# openmixer-plugin-qualify-<version>.tgz (dist/ built in). Anything else builds unsigned trees and packs
# and checks the tarball, and publishes nothing. The RPM and DEB builds are in Open-Mixer/.github; the
# secrets are the organisation's. The npm registry has its own workflow, publish.yml.

# A manual run with staged on (never a tag) builds fc45 x86_64 and trixie arm64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag, or one naming a tag in source-ref, publishes'
        type: boolean
        default: false
      source-ref:
        description: 'Tag v<version> to release with this workflow (a tag whose own release workflow can no longer run); empty builds the branch'
        type: string
        default: ''
      republish:
        description: 'Let the release go out over a version the channel already serves (finish a partial publish)'
        type: boolean
        default: false
      staged:
        description: 'Build fc45 x86_64 and trixie arm64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      catch-up:
        description: 'With source-ref: build and publish only the cells of the set the served version lacks; never rewrites a file the channel serves'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the arm64 DEBs too (no Fedora aarch64 RPM is built); the pull-request dry run passes false (arm builds run at release only)'
      staged:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  # the targets are declared ONCE, in .github/release-matrix.json: this job derives what the rpm and deb builds and the
  # install job read, so a target dropped there is dropped from the install with it (#98)
  matrix:
    name: Derive the build and install matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rpm-fedora: ${{ steps.derive.outputs.rpm-fedora }}
      rpm-arches: ${{ steps.derive.outputs.rpm-arches }}
      deb-suites: ${{ steps.derive.outputs.deb-suites }}
      deb-arches: ${{ steps.derive.outputs.deb-arches }}
      cells: ${{ steps.cells.outputs.cells }}
      count: ${{ steps.cells.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}
      # tools/release-matrix.mjs decides that it was run with omx-contract's isMain (@openmixer/omx-contract/entry)
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: derive
        # only a pull request's dry run (arm: false) builds the first architecture alone
        run: node tools/release-matrix.mjs "${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
      # the install cells, each with the runner of its own architecture, and only those the release set builds: the quick
      # set holds trixie arm64 alone, so no amd64 deb cell is asked for while it is quick (#130)
      - id: cells
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: ${{ steps.derive.outputs.rpm-fedora }}
          rpm-arches: ${{ steps.derive.outputs.install-rpm-arches }}
          deb-releases: ${{ steps.derive.outputs.deb-suites }}
          deb-arches: ${{ steps.derive.outputs.install-deb-arches }}
          x86-runner: ${{ vars.OMX_RUNNER || 'ubuntu-latest' }}

  rpm:
    needs: matrix
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: plugin-qualify
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      needs-mod-host: false
      # plugin-db-devel, whose pin.h the CLAP prober builds against, plugin-hostd-protocol-devel, and omx-clap-lv2-devel, the
      # LV2 measurer's host features
      channel-deps: true
      fedora-versions: ${{ needs.matrix.outputs.rpm-fedora }}
      arch-matrix: ${{ needs.matrix.outputs.rpm-arches }}
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    needs: matrix
    # only after the RPM passed: a DEB never ships beside a failed RPM (the shared release-order check)
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: plugin-qualify
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      # the CLAP headers from the pin, plugin-db-dev (pin.h) and libplugin-hostd-protocol-dev from the channel: the CLAP prober's build;
      # libomx-clap-lv2-dev from the channel: the LV2 measurer's host features
      dependencies: 'clap-headers'
      requires: ''
      # the release-notes filter of the build (changelog.sh) runs python3, which the debian: image does not carry
      build-packages: python3
      channel-deps: true
      suite-matrix: ${{ needs.matrix.outputs.deb-suites }}
      arch-matrix: ${{ needs.matrix.outputs.deb-arches }}
    secrets: inherit

  # the built package, installed in its own distribution, qualifies the fixture plugins with no
  # OMX_* setting: the prober, the measurer and the interposer are found where the package put them
  installed:
    name: Install and qualify (${{ matrix.cell.image }}, ${{ matrix.cell.arch }})
    needs: [matrix, rpm, deb]
    # not on a staged run: it reads packages a staged run does not build; no cell, no job
    if: ${{ !cancelled() && inputs.staged != true && needs.matrix.outputs.count != '0' }}
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    # qualifying starts private JACK servers, which map their segments in /dev/shm, more than a container's default 64 MB
    container:
      image: ${{ matrix.cell.image }}
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}

      # a catch-up builds only the cells the channel lacks: an image whose cell it did not build has no artifact and is
      # skipped, saying so; the new cell is installed and qualified
      - id: pkgs
        uses: actions/download-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
        with:
          name: ${{ matrix.cell.fedora && format('plugin-qualify-rpms-fc{0}-{1}', matrix.cell.fedora, matrix.cell.arch) || format('plugin-qualify-debs-{0}-{1}', matrix.cell.suite, matrix.cell.arch) }}
          path: pkgs

      - name: Say a cell the catch-up did not build is skipped
        if: steps.pkgs.outcome != 'success'
        env:
          ARTIFACT: ${{ matrix.cell.fedora && format('plugin-qualify-rpms-fc{0}-{1}', matrix.cell.fedora, matrix.cell.arch) || format('plugin-qualify-debs-{0}-{1}', matrix.cell.suite, matrix.cell.arch) }}
        run: |
          echo "::notice::catch-up: $ARTIFACT was not built by this run (the channel serves that cell), so it is not installed here"

      # the OpenMixer channel serves omx-clap-host (omx-clap-scan) and omx-clap-libs (libomx-clap1 on Debian: the hosting codes'
      # TypeScript modules), which the package depends on, and the CLAP headers the fixtures build
      # against on Debian. The package alone pulls no development package; the fixtures' build tools
      # come after that check.
      - name: Add the OpenMixer channel (Fedora)
        if: matrix.cell.fedora && steps.pkgs.outcome == 'success'
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - name: Install the package (Fedora)
        if: matrix.cell.fedora && steps.pkgs.outcome == 'success'
        env:
          ARCH: ${{ matrix.cell.arch }}
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          # the main package requires plugin-hostd-contract, which ships the qualification domain: dnf takes it from the channel
          dnf_retry ./pkgs/plugin-qualify-[0-9]*."$ARCH".rpm
          # the store's commands come with the package; the store's base comes with the records package, which the sync
          # below reads: an absent base is an empty base layer (the sync says so once), and no record file stands in for it
          rpm -q plugin-qualification-db plugin-qualification-db-write
          dnf_retry plugin-qualification-records
          rpm -q omx-clap-host
          rpm -qf /usr/share/omx-clap/ts | grep -q '^omx-clap-libs-[0-9]'
          if rpm -qa --qf '%{NAME}\n' | grep -E -- '-devel$'; then echo "plugin-qualify pulled a -devel package"; exit 1; fi
          # mod-host is only suggested: the install with weak dependencies on does not pull it, so the qualification below
          # runs on a machine without it
          rpm -q --suggests plugin-qualify | grep -qx mod-host
          if rpm -q --recommends --requires plugin-qualify | grep -q mod-host; then echo "plugin-qualify needs or recommends mod-host"; exit 1; fi
          if rpm -q mod-host; then echo "plugin-qualify pulled mod-host"; exit 1; fi
          dnf_retry --setopt=install_weak_deps=False gcc make pkgconf-pkg-config clap-devel lv2-devel

      - name: Prepare the container (Debian)
        if: matrix.cell.suite && steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl

      - name: Add the OpenMixer channel (Debian)
        if: matrix.cell.suite && steps.pkgs.outcome == 'success'
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - name: Install the package (Debian)
        if: matrix.cell.suite && steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          # the main package depends on plugin-hostd-contract, which ships the qualification domain: apt takes it from the channel
          apt-get install -y ./pkgs/"$SUITE"/plugin-qualify_*.deb
          # the store's commands come with the package; the store's base comes with the records package, which the sync
          # below reads: an absent base is an empty base layer (the sync says so once), and no record file stands in for it
          dpkg -s plugin-qualification-db plugin-qualification-db-write >/dev/null
          apt-get install -y plugin-qualification-records
          dpkg -s omx-clap-host >/dev/null
          dpkg -S /usr/share/omx-clap/ts | grep -q '^libomx-clap1'
          if dpkg-query -W -f '${Package}\n' | grep -E -- '-dev$'; then echo "plugin-qualify pulled a -dev package"; exit 1; fi
          # mod-host is only suggested, and the qualification below runs without it
          dpkg-query -W -f '${Suggests}\n' plugin-qualify | grep -qw mod-host
          if dpkg-query -W -f '${Depends} ${Recommends}\n' plugin-qualify | grep -qw mod-host; then echo "plugin-qualify needs or recommends mod-host"; exit 1; fi
          if dpkg -s mod-host >/dev/null 2>&1; then echo "plugin-qualify pulled mod-host"; exit 1; fi
          apt-get install -y --no-install-recommends gcc libc6-dev make pkgconf clap-headers lv2-dev
        env:
          SUITE: ${{ matrix.cell.suite }}

      # a module the installed program imports at run time that the package does not carry (ajv, for the qualification
      # domain's reader) fails here by name, before any plugin is measured; the domain itself opens from the contract
      # directory plugin-hostd-contract installed
      - name: The installed program loads its run-time modules and its domain
        if: steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          dir=/usr/lib/node_modules/@openmixer/plugin-qualify
          node --input-type=module -e "
            const { openQualificationDomainAt } = await import('$dir/dist/qualification-domain-node.js');
            await import('$dir/dist/index.js');
            const d = openQualificationDomainAt('/usr/share/omx-contract/contract.d');
            if (!d) throw new Error('the qualification domain did not open');
          "

      - name: Build the fixture plugins
        if: steps.pkgs.outcome == 'success'
        run: |
          make -C native BUILD="$RUNNER_TEMP/fixture" "$RUNNER_TEMP/fixture/fixtures/rt-safe.clap" "$RUNNER_TEMP/fixture/fixtures/rt-unsafe.clap" \
            "$RUNNER_TEMP/fixture/fixtures/lv2/rt-safe.lv2/gain.so" "$RUNNER_TEMP/fixture/fixtures/lv2/rt-unsafe.lv2/gain.so"

      - name: Qualify them with nothing set
        if: steps.pkgs.outcome == 'success'
        run: |
          packaging/check-installed.sh "$RUNNER_TEMP/fixture/fixtures/rt-safe.clap" "$RUNNER_TEMP/fixture/fixtures/rt-unsafe.clap" \
            "$RUNNER_TEMP/fixture/fixtures/lv2"

  pack:
    name: pnpm pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - name: The tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG is not $want (package.json)"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Pack the tarball the release carries
        run: |
          set -euo pipefail
          pnpm pack --pack-destination pack
          node packaging/check-tarball.mjs pack/openmixer-plugin-qualify-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-pack
          path: pack/*.tgz

  attach:
    name: Attach the tarball to the GitHub release
    needs: [pack, deb]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pnpm-pack
          path: pack
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # a rerun of the run finds its own tarball attached: the same bytes are kept and the job is green; a tarball of
        # the same name with other bytes is never replaced (a published release does not change), it is red by name
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for f in pack/*.tgz; do
              name=$(basename "$f")
              have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | .digest")
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              if [ -z "$have" ]; then
                gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
              elif [ "$have" = "$want" ]; then
                echo "::notice::$name is already attached to $TAG with the same bytes ($want)"
              else
                echo "::error::$name is attached to $TAG as $have, this run packed $want: a release asset is never replaced"
                exit 1
              fi
            done
          else
            gh release create "$TAG" pack/*.tgz --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
