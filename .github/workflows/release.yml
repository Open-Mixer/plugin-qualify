name: release

# A version tag builds the RPM (Fedora 44, x86_64 and aarch64) and the DEB (Debian bookworm and trixie,
# amd64 and arm64), signs them, publishes them into the rpm/ and deb/ trees of the OpenMixer Pages
# repository and attaches them to the GitHub release, beside the `pnpm pack` tarball
# openmixer-plugin-qualify-<version>.tgz (dist/ built in). Anything else builds unsigned trees and packs
# and checks the tarball, and publishes nothing. The RPM and DEB builds are in Open-Mixer/.github; the
# secrets are the organisation's. The npm registry has its own workflow, publish.yml.

# A manual run with staged on (never a tag) builds fc44 x86_64 and trixie amd64 only, against the staging channel, and
# publishes them, signed, to the staging channel (staging/rpm and staging/deb of the channel repository), where the
# next layer of the release chain finds them by adding the staging channel beside the real one. Nothing reaches the
# real channel, and the real release still publishes once from the v<version> tag (Open-Mixer/.github build-rpm.yml
# and build-deb.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag, or one naming a tag in source-ref, publishes'
        type: boolean
        default: false
      source-ref:
        description: 'Tag v<version> to release with this workflow (a tag whose own release workflow can no longer run); empty builds the branch'
        type: string
        default: ''
      republish:
        description: 'Let the release go out over a version the channel already serves (finish a partial publish)'
        type: boolean
        default: false
      staged:
        description: 'Build fc44 x86_64 and trixie amd64 only and publish them to the staging channel for the next layer; publishes nothing to the real channel'
        type: boolean
        default: false
      catch-up:
        description: 'With source-ref: build and publish only the cells of the set the served version lacks; never rewrites a file the channel serves'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      arm:
        type: boolean
        default: true
        description: 'Build the aarch64/arm64 packages too; the pull-request dry run passes false (arm builds run at release only)'
      staged:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: plugin-qualify
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      needs-mod-host: false
      # plugin-db-devel, whose pin.h the CLAP prober builds against, plugin-hostd-protocol-devel, and omx-clap-lv2-devel, the
      # LV2 measurer's host features
      channel-deps: true
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && '["x86_64"]' || '["x86_64", "aarch64"]' }}
    secrets: inherit

  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    # only after the RPM passed: a DEB never ships beside a failed RPM (the shared release-order check)
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      staged: ${{ inputs.staged == true }}
      package-name: plugin-qualify
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      source-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref || '' }}
      republish: ${{ github.event_name == 'workflow_dispatch' && inputs.republish == true }}
      catch-up: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
      # the CLAP headers from the pin, plugin-db-dev (pin.h) and libplugin-hostd-protocol-dev from the channel: the CLAP prober's build;
      # libomx-clap-lv2-dev from the channel: the LV2 measurer's host features
      dependencies: 'clap-headers'
      requires: ''
      # the release-notes filter of the build (changelog.sh) runs python3, which the debian: image does not carry
      build-packages: python3
      channel-deps: true
      arch-matrix: ${{ (github.event_name != 'push' && inputs.arm == false && !inputs.source-ref) && '["amd64"]' || '["amd64", "arm64"]' }}
    secrets: inherit

  # the built package, installed in its own distribution, qualifies the fixture plugins with no
  # OMX_* setting: the prober, the measurer and the interposer are found where the package put them
  installed:
    name: Install and qualify (${{ matrix.image }})
    needs: [rpm, deb]
    # not on a staged run: it reads packages a staged run does not build
    if: ${{ !cancelled() && inputs.staged != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # ruling D25: the cells the rpm and deb jobs built for this run, chosen as Open-Mixer/.github's release-matrix
        # chooses them (matrix.sh): a release (a tag, or source-ref) and a manual run build what OMX_RELEASE_MATRIX
        # says, a release the full matrix without it and a manual run the quick set; the dry run of a pull request or
        # a push builds the full matrix. bookworm, a full cell, joins only when the deb job built it.
        include: ${{ fromJSON((vars.OMX_RELEASE_MATRIX == 'quick' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') || !vars.OMX_RELEASE_MATRIX && github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && !inputs.source-ref) && '[{"image":"fedora:44", "artifact":"plugin-qualify-rpms-fc44-x86_64"}, {"image":"debian:trixie", "artifact":"plugin-qualify-debs-trixie-amd64"}]' || '[{"image":"fedora:44", "artifact":"plugin-qualify-rpms-fc44-x86_64"}, {"image":"debian:bookworm", "artifact":"plugin-qualify-debs-bookworm-amd64"}, {"image":"debian:trixie", "artifact":"plugin-qualify-debs-trixie-amd64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-ref && format('refs/tags/{0}', inputs.source-ref) || '' }}

      # a catch-up builds only the cells the channel lacks: an image whose cell it did not build has no artifact and is
      # skipped, saying so; the new cell is installed and qualified
      - id: pkgs
        uses: actions/download-artifact@v4
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.catch-up == true }}
        with:
          name: ${{ matrix.artifact }}
          path: pkgs

      - name: Say a cell the catch-up did not build is skipped
        if: steps.pkgs.outcome != 'success'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          echo "::notice::catch-up: $ARTIFACT was not built by this run (the channel serves that cell), so it is not installed here"

      # the OpenMixer channel serves omx-clap-host (omx-clap-scan) and omx-clap-core (the hosting codes'
      # TypeScript modules), which the package depends on, and the CLAP headers the fixtures build
      # against on Debian. The package alone pulls no development package; the fixtures' build tools
      # come after that check.
      - name: Add the OpenMixer channel (Fedora)
        if: startsWith(matrix.image, 'fedora') && steps.pkgs.outcome == 'success'
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - name: Install the package (Fedora)
        if: startsWith(matrix.image, 'fedora') && steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          # a mirror that fails in mid-transfer (curl 56, zchunk checksums) is tried again; a real install error fails the
          # third attempt with its own output on the log
          dnf_retry() {
            local n
            for n in 1 2 3; do
              dnf install -y --setopt=retries=5 "$@" && return 0
              [ "$n" -lt 3 ] && { echo "::warning::dnf install failed, attempt $n of 3"; sleep 15; }
            done
            return 1
          }
          dnf_retry ./pkgs/plugin-qualify-[0-9]*.x86_64.rpm
          rpm -q omx-clap-host
          rpm -qf /usr/share/omx-clap-core/ts | grep -q '^omx-clap-core-[0-9]'
          if rpm -qa --qf '%{NAME}\n' | grep -E -- '-devel$'; then echo "plugin-qualify pulled a -devel package"; exit 1; fi
          # mod-host is only suggested: the install with weak dependencies on does not pull it, so the qualification below
          # runs on a machine without it
          rpm -q --suggests plugin-qualify | grep -qx mod-host
          if rpm -q --recommends --requires plugin-qualify | grep -q mod-host; then echo "plugin-qualify needs or recommends mod-host"; exit 1; fi
          if rpm -q mod-host; then echo "plugin-qualify pulled mod-host"; exit 1; fi
          dnf_retry --setopt=install_weak_deps=False gcc make pkgconf-pkg-config clap-devel lv2-devel

      - name: Prepare the container (Debian)
        if: startsWith(matrix.image, 'debian') && steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl

      - name: Add the OpenMixer channel (Debian)
        if: startsWith(matrix.image, 'debian') && steps.pkgs.outcome == 'success'
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - name: Install the package (Debian)
        if: startsWith(matrix.image, 'debian') && steps.pkgs.outcome == 'success'
        run: |
          set -euo pipefail
          suite=${IMAGE#debian:}
          apt-get install -y ./pkgs/"$suite"/plugin-qualify_*.deb
          dpkg -s omx-clap-host >/dev/null
          dpkg -S /usr/share/omx-clap-core/ts | grep -q '^libomx-clap-core1'
          if dpkg-query -W -f '${Package}\n' | grep -E -- '-dev$'; then echo "plugin-qualify pulled a -dev package"; exit 1; fi
          # mod-host is only suggested, and the qualification below runs without it
          dpkg-query -W -f '${Suggests}\n' plugin-qualify | grep -qw mod-host
          if dpkg-query -W -f '${Depends} ${Recommends}\n' plugin-qualify | grep -qw mod-host; then echo "plugin-qualify needs or recommends mod-host"; exit 1; fi
          if dpkg -s mod-host >/dev/null 2>&1; then echo "plugin-qualify pulled mod-host"; exit 1; fi
          apt-get install -y --no-install-recommends gcc libc6-dev make pkgconf clap-headers lv2-dev
        env:
          IMAGE: ${{ matrix.image }}

      - name: Build the fixture plugins
        if: steps.pkgs.outcome == 'success'
        run: |
          make -C native BUILD="$RUNNER_TEMP/fixture" "$RUNNER_TEMP/fixture/fixtures/rt-safe.clap" "$RUNNER_TEMP/fixture/fixtures/rt-unsafe.clap" \
            "$RUNNER_TEMP/fixture/fixtures/lv2/rt-safe.lv2/gain.so" "$RUNNER_TEMP/fixture/fixtures/lv2/rt-unsafe.lv2/gain.so"

      - name: Qualify them with nothing set
        if: steps.pkgs.outcome == 'success'
        run: |
          packaging/check-installed.sh "$RUNNER_TEMP/fixture/fixtures/rt-safe.clap" "$RUNNER_TEMP/fixture/fixtures/rt-unsafe.clap" \
            "$RUNNER_TEMP/fixture/fixtures/lv2"

  pack:
    name: pnpm pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - name: The tag names the package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG is not $want (package.json)"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Pack the tarball the release carries
        run: |
          set -euo pipefail
          pnpm pack --pack-destination pack
          node packaging/check-tarball.mjs pack/openmixer-plugin-qualify-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-pack
          path: pack/*.tgz

  attach:
    name: Attach the tarball to the GitHub release
    needs: [pack, deb]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.pack.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pnpm-pack
          path: pack
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pack/*.tgz --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pack/*.tgz --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
