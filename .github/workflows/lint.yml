name: lint

# The ONE lint workflow of this repository (delivery pipeline §12): the only file that runs on a pull request, never
# on a push. It is cheap and does nothing else: the shared trigger gate, which refuses a push or pull-request
# trigger in every other workflow, and the shared public-sources check (commit messages, private references). The
# build and the tests are ci.yml's, dispatched on a pull request's head before it merges (gh workflow run ci.yml --ref <branch>).
# The other workflows run on a tag or by workflow_dispatch. Both checks come from Open-Mixer/.github at openmixer-v1.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trigger-gate:
    name: trigger gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: lint.yml

  # the checks every OpenMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
    with:
      commit-identity: true

  # the dependency floors: the spec, debian/control and the workflows' install lines state floors and no ceiling. This
  # repository has no packaging/deps.txt, so the shared deps-render action only refuses ceilings (Open-Mixer/.github's
  # deps-render, at the same openmixer-v1 ref every shared action of this repository uses)
  deps-render:
    name: the packaging states floors only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/deps-render@openmixer-v1

  # Fedora 45 only: a workflow that names the dropped release is refused here
  fedora:
    name: no Fedora 44 reference in the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tools/test/workflow-fedora-check.sh --self-test
      - run: tools/test/workflow-fedora-check.sh .

  # the spec and debian/control declare the same CLAP floor (packaging/check-clap-floor.mjs, which decides that it was
  # run with omx-contract's isMain, @openmixer/omx-contract/entry: the dependencies are installed first)
  clap-floor:
    name: the spec and debian/control agree on the CLAP floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node packaging/check-clap-floor.mjs

  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
