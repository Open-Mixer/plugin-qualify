name: Install the scanners the tests read real plugins with
description: python3-lilv and jsonschema, omx-clap-scan with omx-clap-host's fake plugin, three LV2 plugin packages and jackd, so the scanner goldens and the sync's daemon test run on CI and never skip there.

# Shared by ci.yml and publish.yml, after install-plugin-hostd, in their fedora:45 container with the OpenMixer channel
# added. src/workflows-agree.test.ts fails if a workflow stops using this action. The tools run under the system
# python3, which imports the distribution's python3-lilv as it is.

runs:
  using: composite
  steps:
    - name: Install from the distribution and the OpenMixer channel
      shell: bash
      run: |
        set -euo pipefail
        # jack-audio-connection-kit: a dummy JACK server, so the sync's test chains two plugins in a real omx-clap-host worker
        # lv2-mdala-plugins: mda.lv2, a real instrument for the adapter pass, whose held note a stand-in cannot prove
        # time: /usr/bin/time, the peak memory src/lv2-measure-pass-memory.test.ts reads
        dnf install -y --setopt=install_weak_deps=False python3 python3-lilv python3-jsonschema python3-pytest time \
          lv2-zam-plugins lv2-calf-plugins lv2-mdala-plugins jack-audio-connection-kit omx-clap-host omx-clap-host-tests
        python3 -c 'import jsonschema, lilv'
        test -x /usr/bin/omx-clap-scan
        test -f /usr/libexec/omx-clap-host/tests/fake.clap
        {
          echo "OMX_CLAP_SCAN=/usr/bin/omx-clap-scan"
          echo "OMX_CLAP_FAKE=/usr/libexec/omx-clap-host/tests/fake.clap"
        } >> "$GITHUB_ENV"
