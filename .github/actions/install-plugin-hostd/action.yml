name: Install plugin-hostd and its fake worker
description: plugin-hostd and its fake worker, from the OpenMixer channel, for the pins-file test.

# Shared by ci.yml and publish.yml: both run the whole suite, and the pins-file test starts the real daemon on a
# qualified pins file. Their jobs run in a fedora:45 container with the OpenMixer channel added: the channel serves
# plugin-hostd for Fedora x86_64 at every release.
# src/workflows-agree.test.ts fails if a workflow stops using this action.

runs:
  using: composite
  steps:
    - name: Install from the OpenMixer channel
      shell: bash
      run: |
        set -euo pipefail
        # the packages packaging/plugin-qualify.spec requires, as the channel serves them
        dnf install -y --setopt=install_weak_deps=False plugin-hostd plugin-hostd-tests \
          plugin-hostd-contract plugin-hostd-protocol-contract
        # the qualification domain is plugin-hostd-contract's: the ordinary test run reads it at the installed place, so
        # a plugin-hostd without it fails here by name, not in the first test
        test -f /usr/share/omx-contract/contract.d/qualification/qualification.json || { echo "::error::plugin-hostd-contract in the channel ships no qualification domain"; exit 1; }
        echo "PLUGIN_HOSTD=/usr/bin/plugin-hostd" >> "$GITHUB_ENV"
        # the runner is here now, so src/grid-runs.test.ts fails its live arms instead of skipping them
        echo "OMX_PROBE_RUNNER_REQUIRED=1" >> "$GITHUB_ENV"
        echo "PLUGIN_HOSTD_FAKE_HOST=/usr/libexec/plugin-hostd/tests/fake-host" >> "$GITHUB_ENV"
