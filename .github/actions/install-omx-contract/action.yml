name: Install omx-contract
description: omx-contract 3.20.0 or later (the installer's domain mode, its fmt command, its pkg-config file), from the OpenMixer channel, for the tests of the qualification domain's installation.

# Shared by ci.yml and publish.yml, like the other runner preparation (src/workflows-agree.test.ts). The three packages
# are architecture-independent and are taken from the trixie suite of the channel as files: 3.20.0 is not in the
# bookworm suite install-plugin-hostd writes, and adding the trixie suite as a source would let apt move plugin-hostd
# to a build for a newer glibc than the runner has.

runs:
  using: composite
  steps:
    - name: Install from the OpenMixer channel
      shell: bash
      run: |
        set -euo pipefail
        base=https://www.openmixer.org/deb/debian/trixie
        curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/Packages" "$base/Packages"
        # the newest omx-contract, then the files of that same version
        entries() { awk -v want="$1" 'BEGIN{RS="";FS="\n"} { p=""; v=""; f=""; for(i=1;i<=NF;i++){ if($i ~ /^Package: /)p=substr($i,10); if($i ~ /^Version: /)v=substr($i,10); if($i ~ /^Filename: /)f=substr($i,11) } if(p==want)print v, f }' "$RUNNER_TEMP/Packages"; }
        v=$(entries omx-contract | cut -d' ' -f1 | sort -V | tail -1)
        dpkg --compare-versions "$v" ge 3.20.0 || { echo "::error::omx-contract $v in the channel; the installer's domain mode is 3.20.0 or later"; exit 1; }
        files=()
        for p in omx-contract-data omx-contract libomx-contract-dev; do
          f=$(entries "$p" | awk -v v="$v" '$1==v{print $2}' | head -1)
          [ -n "$f" ] || { echo "::error::$p $v is not in the channel"; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$(basename "$f")" "$base/$f"
          files+=("$RUNNER_TEMP/$(basename "$f")")
        done
        sudo apt-get install -y --no-install-recommends "${files[@]}"
        pkg-config --atleast-version=3.20.0 omx-contract
